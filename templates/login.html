<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyRAG: Sign in</title>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://myrag-o7eu.onrender.com">
  <meta property="og:title" content="MyRAG">
  <meta property="og:description" content="A password-protected AI about me - ask questions and get answers from my own files.">
  <meta property="og:image" content="https://myrag-o7eu.onrender.com/static/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="auth-page">
    <form class="auth-card" method="POST" action="{{ url_for('login') }}">
      <p class="label">MyRAG</p>
      <h1>Sign in</h1>
      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}
      <label class="field-label" for="password">Password</label>
      <input class="field-input" type="password" id="password" name="password" autofocus required>
      <button class="btn-primary" type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
