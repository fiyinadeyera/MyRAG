<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyRAG</title>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://myrag-o7eu.onrender.com">
  <meta property="og:title" content="MyRAG">
  <meta property="og:description" content="A password-protected AI about me - ask questions and get answers from my own files.">
  <meta property="og:image" content="https://myrag-o7eu.onrender.com/static/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <p class="label">MyRAG</p>
    <a class="logout-link" href="{{ url_for('logout') }}">Sign out</a>
  </header>

  <main class="chat-page">
    <section id="messages" class="messages" aria-live="polite"></section>

    <form id="chat-form" class="chat-form">
      <textarea
        id="question-input"
        class="chat-input"
        placeholder="Ask me anything"
        rows="1"
        required
      ></textarea>
      <button class="btn-primary" type="submit">Send</button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
